<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${id} ? 'Editar cliente' : 'Novo cliente')}"></head>
<body data-pagina="clientes-form" th:data-id="${id}">
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>

<main class="container py-4">
    <nav aria-label="Caminho">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/app/clientes}">Clientes</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${id} ? 'Editar' : 'Novo'">Novo</li>
        </ol>
    </nav>

    <div class="page-header">
        <div>
            <h1 th:text="${id} ? 'Editar cliente' : 'Novo cliente'">Novo cliente</h1>
            <p class="subtitulo">Campos marcados com * são obrigatórios</p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8 col-xl-6">
            <div class="card" id="conteudo-formulario">
                <div class="card-body p-4">
                    <form id="form-cliente" novalidate>
                        <div class="alert alert-danger alerta-formulario d-none" role="alert"></div>

                        <fieldset id="campos-cliente" th:disabled="${id != null}">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome *</label>
                                <input id="nome" name="nome" class="form-control" maxlength="100" autocomplete="name">
                                <div class="invalid-feedback" data-erro-de="nome"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail *</label>
                                <input id="email" name="email" type="email" class="form-control" maxlength="120"
                                       autocomplete="email">
                                <div class="invalid-feedback" data-erro-de="email"></div>
                            </div>

                            <div class="mb-4">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input id="telefone" name="telefone" type="tel" class="form-control" maxlength="20"
                                       autocomplete="tel" placeholder="Ex.: 47999999999">
                                <div class="invalid-feedback" data-erro-de="telefone"></div>
                            </div>

                            <div class="d-flex gap-2 justify-content-end">
                                <a class="btn btn-outline-secondary"
                                   th:href="${id} ? @{/app/clientes/{id}(id=${id})} : @{/app/clientes}">Cancelar</a>
                                <button id="botao-salvar" type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i>Salvar
                                </button>
                            </div>
                        </fieldset>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: rodape}"></th:block>
<script th:src="@{/js/clientes.js}"></script>
</body>
</html>
