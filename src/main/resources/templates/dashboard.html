<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body data-pagina="dashboard">
<nav th:replace="~{fragments/layout :: navbar('dashboard')}"></nav>

<main class="container py-4" id="conteudo-dashboard">
    <div class="page-header">
        <div>
            <h1>Dashboard</h1>
            <p class="subtitulo" id="resumo-total">Visão geral dos chamados</p>
        </div>
        <a class="btn btn-primary" th:href="@{/app/chamados/novo}">
            <i class="bi bi-plus-lg me-1"></i>Novo chamado
        </a>
    </div>

    <h2 class="visually-hidden">Chamados por status</h2>
    <div class="row g-3 mb-4" id="cartoes-status"></div>

    <div class="row g-4 mb-4">
        <div class="col-lg-5">
            <div class="card h-100">
                <div class="card-header bg-body py-3">
                    <h2 class="h6 mb-0"><i class="bi bi-bar-chart me-2"></i>Chamados por prioridade</h2>
                </div>
                <div class="card-body d-flex flex-column justify-content-center gap-3" id="barras-prioridade">
                    <div class="text-center py-4">
                        <div class="spinner-border spinner-border-sm text-primary" role="status">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card h-100">
                <div class="card-header bg-body py-3 d-flex justify-content-between align-items-center">
                    <h2 class="h6 mb-0"><i class="bi bi-clock-history me-2"></i>Chamados recentes</h2>
                    <a class="small text-decoration-none" th:href="@{/app/chamados}">Ver todos</a>
                </div>
                <div id="area-recentes" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th scope="col">Título</th>
                            <th scope="col" class="d-none d-md-table-cell">Cliente</th>
                            <th scope="col">Status</th>
                            <th scope="col" class="d-none d-sm-table-cell">Abertura</th>
                        </tr>
                        </thead>
                        <tbody id="tabela-recentes">
                        <tr>
                            <td colspan="4" class="text-center py-4">
                                <div class="spinner-border spinner-border-sm text-primary" role="status">
                                    <span class="visually-hidden">Carregando...</span>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div id="recentes-vazio" class="estado-vazio d-none">
                    <i class="bi bi-inbox"></i>
                    <p class="mb-3">Nenhum chamado aberto ainda.</p>
                    <a class="btn btn-primary" th:href="@{/app/chamados/novo}">
                        <i class="bi bi-plus-lg me-1"></i>Abrir o primeiro chamado
                    </a>
                </div>
            </div>
        </div>
    </div>

    <h2 class="h6 text-body-secondary text-uppercase small fw-semibold mb-3">Cadastros</h2>
    <div class="row g-3" id="cartoes-cadastros"></div>
</main>

<th:block th:replace="~{fragments/layout :: rodape}"></th:block>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
