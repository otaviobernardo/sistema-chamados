<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${id} ? 'Editar técnico' : 'Novo técnico')}"></head>
<body data-pagina="tecnicos-form" th:data-id="${id}">
<nav th:replace="~{fragments/layout :: navbar('tecnicos')}"></nav>

<main class="container py-4">
    <nav aria-label="Caminho">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/app/tecnicos}">Técnicos</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${id} ? 'Editar' : 'Novo'">Novo</li>
        </ol>
    </nav>

    <div class="page-header">
        <div>
            <h1 th:text="${id} ? 'Editar técnico' : 'Novo técnico'">Novo técnico</h1>
            <p class="subtitulo">Campos marcados com * são obrigatórios</p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8 col-xl-6">
            <div class="card" id="conteudo-formulario">
                <div class="card-body p-4">
                    <form id="form-tecnico" novalidate>
                        <div class="alert alert-danger alerta-formulario d-none" role="alert"></div>

                        <fieldset id="campos-tecnico" th:disabled="${id != null}">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome *</label>
                                <input id="nome" name="nome" class="form-control" maxlength="100" autocomplete="name">
                                <div class="invalid-feedback" data-erro-de="nome"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail *</label>
                                <input id="email" name="email" type="email" class="form-control" maxlength="120"
                                       autocomplete="email">
                                <div class="invalid-feedback" data-erro-de="email"></div>
                            </div>

                            <div class="mb-4">
                                <label for="perfil" class="form-label">Perfil *</label>
                                <select id="perfil" name="perfil" class="form-select" aria-describedby="perfil-ajuda">
                                    <option value="">Selecione...</option>
                                    <option value="TECNICO">Técnico</option>
                                    <option value="ADMIN">Administrador</option>
                                </select>
                                <div class="invalid-feedback" data-erro-de="perfil"></div>
                                <div class="form-text" id="perfil-ajuda">
                                    O perfil é apenas informativo: o sistema ainda não tem login.
                                </div>
                            </div>

                            <div class="d-flex gap-2 justify-content-end">
                                <a class="btn btn-outline-secondary" th:href="@{/app/tecnicos}">Cancelar</a>
                                <button id="botao-salvar" type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i>Salvar
                                </button>
                            </div>
                        </fieldset>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: rodape}"></th:block>
<script th:src="@{/js/tecnicos.js}"></script>
</body>
</html>
