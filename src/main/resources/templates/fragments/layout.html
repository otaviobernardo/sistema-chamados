<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${titulo} · Sistema de Chamados|">Sistema de Chamados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:fragment="navbar(ativo)" class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/app}">
            <i class="bi bi-headset"></i> Sistema de Chamados
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal"
                aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu-principal">
            <ul class="navbar-nav ms-auto gap-lg-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/app/dashboard}"
                       th:classappend="${ativo == 'dashboard'} ? 'active'"
                       th:aria-current="${ativo == 'dashboard'} ? 'page'">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/app/chamados}"
                       th:classappend="${ativo == 'chamados'} ? 'active'"
                       th:aria-current="${ativo == 'chamados'} ? 'page'">
                        <i class="bi bi-ticket-detailed me-1"></i>Chamados
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/app/clientes}"
                       th:classappend="${ativo == 'clientes'} ? 'active'"
                       th:aria-current="${ativo == 'clientes'} ? 'page'">
                        <i class="bi bi-people me-1"></i>Clientes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/app/categorias}"
                       th:classappend="${ativo == 'categorias'} ? 'active'"
                       th:aria-current="${ativo == 'categorias'} ? 'page'">
                        <i class="bi bi-tags me-1"></i>Categorias
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/app/tecnicos}"
                       th:classappend="${ativo == 'tecnicos'} ? 'active'"
                       th:aria-current="${ativo == 'tecnicos'} ? 'page'">
                        <i class="bi bi-person-gear me-1"></i>Técnicos
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<th:block th:fragment="rodape">
    <footer class="app-rodape">
        <div class="container">Sistema de Chamados · DAS - Design e Arquitetura de Sistemas</div>
    </footer>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="area-notificacoes"></div>

    <div class="modal fade" id="modal-confirmacao" tabindex="-1"
         aria-labelledby="modal-confirmacao-titulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="modal-confirmacao-titulo">Confirmar exclusão</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="modal-confirmacao-mensagem"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="modal-confirmacao-ok">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
